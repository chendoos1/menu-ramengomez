<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="styles.css">

</head>
<body>
    <header class="restaurant-header">
        <h1>🍜 Ramen GOMEZ</h1>
        <p>Escanea, ordena y disfruta en tu mesa</p>
    </header>

    <main class="menu-container">    <main class="menu-container">
        <!-- Tarjeta de Platillo 1 -->
        <div class="ramen-card" id="platillo-1">
            <img src="imagen1.jpeg" alt="Tonkotsu Ramen" class="ramen-thumb">
            <div class="ramen-info">
                <div class="ramen-title-row">
                    <h3>Tonkotsu Ramen</h3>
                    <span class="price">$160</span>
                </div>
                <p class="description">Caldo espeso de cerdo, fideos firmes, chashu, huevo marinado y alga nori.</p>
                <div class="status-tags">
                    <span class="badge available" id="status-1">🟢 Disponible</span>
                </div>
            </div>
        </div>

        <!-- Tarjeta de Platillo 2 -->
        <div class="ramen-card" id="platillo-2">
            <img src="imagen2.jpeg" alt="Miso Ramen" class="ramen-thumb">
            <div class="ramen-info">
                <div class="ramen-title-row">
                    <h3>Miso Ramen</h3>
                    <span class="price" id="precio-2">$170</span>
                </div>
                <p class="description">Caldo a base de miso, pasta de chile picante, pollo desmenuzado, choclo y cebollín.</p>
                <div class="status-tags">
                    <span class="badge available" id="status-2">🟢 Disponible</span>
                </div>
            </div>
        </div>
    </main>

    </main>
        <!-- Botón Flotante para Pedir la Cuenta -->
    <a href="#" id="btn-cuenta" class="floating-btn" target="_blank">
        💵 Pedir la Cuenta
    </a>

    <script src="app.js"></script>

</body>
</html>
